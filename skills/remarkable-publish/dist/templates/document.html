<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>{{title}}</title>
<style>
  @page {
    size: 6.3in 8.4in;
    margin: 0.6in;
  }
  body {
    font-family: "Liberation Serif", Georgia, serif;
    font-size: 12pt;
    line-height: 1.5;
    color: #111;
  }
  h1, h2, h3, h4, h5, h6 {
    font-family: "Liberation Sans", Arial, sans-serif;
    line-height: 1.25;
  }
  pre, code {
    font-family: "Liberation Mono", monospace;
    font-size: 10pt;
  }
  pre {
    white-space: pre-wrap;
    word-wrap: break-word;
    background: #f4f4f4;
    padding: 0.5em;
  }
  img, svg {
    max-width: 100%;
  }
  blockquote {
    margin: 0;
    padding-left: 1em;
    border-left: 3px solid #ccc;
    color: #444;
  }
</style>
</head>
<body>
{{body}}
</body>
</html>
